<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>المصحف الصوتي الميسر | القرآن الكريم بالأوامر الصوتية</title>
  
  <!-- إعدادات تطبيق الويب PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#022c22">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <!-- خطوط عربية واضحة ومقروءة -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  
  <!-- تنسيقات Tailwind CSS المدمجة عالية الأداء -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-emerald-950 text-white min-h-[100dvh] flex flex-col justify-between font-['Cairo'] select-none overflow-x-hidden safe-area-inset">

  <!-- منطقة الإيماءات اللمسية الشاملة -->
  <div id="gestureArea" class="fixed inset-0 z-0 opacity-0 pointer-events-auto"></div>

  <!-- رأس الصفحة والتنبيهات -->
  <header class="relative z-10 w-full px-3 sm:px-4 pt-2 sm:pt-4 pb-1 sm:pb-2 safe-top">
    <!-- شريط تنبيه الأدمن المباشر -->
    <div id="adminBanner" class="hidden mb-2 sm:mb-3 p-2.5 sm:p-3 bg-amber-500/20 border border-amber-500/40 rounded-2xl text-amber-200 text-xs sm:text-sm font-semibold text-center backdrop-blur-md animate-pulse"></div>

    <div class="flex items-center justify-between max-w-md mx-auto">
      <div class="flex items-center space-x-2 space-x-reverse">
        <div class="w-9 h-9 sm:w-10 sm:h-10 rounded-2xl bg-emerald-800/80 border border-emerald-600/40 flex items-center justify-center text-amber-400 font-bold text-lg sm:text-xl shadow-lg">
          📖
        </div>
        <div>
          <h1 class="text-base sm:text-lg font-black tracking-wide text-amber-300">المصحف الصوتي الميسر</h1>
          <p class="text-[11px] sm:text-xs text-emerald-300/80">مخصص لفاقدي البصر وكبار السن</p>
        </div>
      </div>

      <div class="flex items-center space-x-2 space-x-reverse">
        <!-- زر تبديل لهجة التعرف الصوتي (مصرية / فصحى) -->
        <button id="dialectToggleBtn" type="button" class="px-2.5 py-1.5 sm:py-2 rounded-xl bg-emerald-900/60 border border-emerald-700/40 text-amber-300 hover:border-amber-400/50 hover:bg-emerald-800/80 transition-all flex items-center space-x-1 space-x-reverse text-xs font-bold shadow cursor-pointer" title="تبديل لهجة التعرف الصوتي">
          <span id="dialectFlag">🇪🇬</span>
          <span id="dialectLabel">مصرية</span>
        </button>

        <!-- رابط لوحة الأدمن والإعدادات -->
        <a href="admin.html" id="adminLinkBtn" onclick="try { sessionStorage.setItem('quran_admin_auth', 'true'); localStorage.setItem('quran_admin_auth', 'true'); } catch(e){}" class="px-2.5 py-2 sm:p-2.5 rounded-xl bg-emerald-900/60 border border-emerald-700/40 text-emerald-300 hover:text-amber-300 hover:border-amber-400/50 transition-all flex items-center space-x-1 space-x-reverse text-xs" title="لوحة تحكم المشرف">
          <span>⚙️</span>
          <span class="font-bold">الإدارة</span>
        </a>
      </div>
    </div>
  </header>

  <!-- المحتوى الرئيسي: بطاقة السورة والآية الحالية -->
  <main class="relative z-10 flex-1 flex flex-col justify-center items-center px-3 sm:px-4 py-1 sm:py-2 max-w-md mx-auto w-full">
    
    <!-- بطاقة السورة الكبرى -->
    <div class="main-card w-full bg-gradient-to-b from-emerald-900/90 to-emerald-950/90 border border-emerald-700/40 rounded-2xl sm:rounded-3xl p-4 sm:p-6 shadow-2xl backdrop-blur-lg text-center relative overflow-hidden">
      <div class="absolute -top-12 -right-12 w-32 h-32 bg-amber-500/10 rounded-full blur-2xl"></div>
      <div class="absolute -bottom-12 -left-12 w-32 h-32 bg-emerald-500/10 rounded-full blur-2xl"></div>

      <!-- رقم الآية وشارة الذكاء الاصطناعي -->
      <div class="flex items-center justify-center gap-2 mb-2 sm:mb-3">
        <div class="inline-flex items-center px-3.5 py-1 sm:px-4 sm:py-1.5 rounded-full bg-amber-500/20 border border-amber-400/30 text-amber-300 text-xs sm:text-sm font-bold shadow-inner" id="ayahBadge">
          الآية 1
        </div>
        <div class="inline-flex items-center px-2.5 py-0.5 sm:px-3 sm:py-1 rounded-full bg-emerald-800/80 border border-amber-400/30 text-amber-300 text-[11px] sm:text-xs font-semibold shadow-inner" title="محرك الذكاء الاصطناعي نشط لفهم الأوامر والبحث الموضوعي في القرآن">
          <span class="ml-1 text-xs">✨</span>
          <span>Gemini AI</span>
        </div>
      </div>

      <!-- اسم السورة بخط أميري جليل متجاوب -->
      <h2 id="surahName" class="surah-title text-3xl sm:text-4xl md:text-5xl font-['Amiri'] font-bold text-white mb-1 sm:mb-2 tracking-wide drop-shadow-md">
        سورة الفاتحة
      </h2>
      
      <p id="surahMeta" class="text-xs sm:text-sm text-emerald-300/80 mb-2 sm:mb-4 font-semibold">
        مكية • 7 آيات
      </p>

      <!-- اسم القارئ الحالي -->
      <div class="inline-flex items-center space-x-2 space-x-reverse px-3 sm:px-4 py-1.5 sm:py-2 rounded-xl sm:rounded-2xl bg-emerald-950/60 border border-emerald-800/60 text-emerald-200 text-xs sm:text-sm font-medium mb-3 sm:mb-6">
        <span>🎙️</span>
        <span id="reciterName">بصوت الشيخ محمود خليل الحصري</span>
      </div>

      <!-- شريط تقدم الآية -->
      <div class="w-full bg-emerald-950 rounded-full h-2 mb-2 overflow-hidden border border-emerald-800/40">
        <div id="progressBar" class="bg-gradient-to-r from-amber-400 to-amber-500 h-2 rounded-full w-0 transition-all duration-200"></div>
      </div>

      <!-- حالة الأمر الصوتي والنص المنطوق -->
      <div class="min-h-[44px] sm:min-h-[50px] flex flex-col items-center justify-center pt-1">
        <p id="voiceStatus" class="text-xs sm:text-sm font-medium text-amber-200/90 transition-all text-center">
          اضغط مطولاً في أي مكان أو انقر الميكروفون
        </p>
        <p id="voiceTranscript" class="text-xs text-emerald-400 font-bold mt-1 tracking-wide"></p>
      </div>
    </div>

    <!-- حاوية عناصر التحكم للموبايل والوضع الأفقي -->
    <div class="landscape-controls flex flex-col items-center justify-center w-full">
      <!-- زر الميكروفون التفاعلي الدائري المتجاوب -->
      <div class="mic-container my-3 sm:my-5 relative flex items-center justify-center">
        <button id="micBtn" class="mic-button relative z-10 w-20 h-20 sm:w-24 sm:h-24 rounded-full bg-gradient-to-tr from-amber-500 to-amber-400 hover:from-amber-400 hover:to-amber-300 text-emerald-950 flex items-center justify-center shadow-xl shadow-amber-500/20 active:scale-95 transition-all focus:outline-none focus:ring-4 focus:ring-amber-400/40" aria-label="تحدث بالأمر الصوتي">
          <svg class="w-8 h-8 sm:w-10 sm:h-10" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 003-3V5a3 3 0 10-6 0v6a3 3 0 003 3z"></path>
          </svg>
        </button>
        <!-- أمواج النبض التفاعلي أثناء الاستماع -->
        <div class="mic-wave"></div>
      </div>

      <!-- أزرار التحكم اللمسية السريعة المتجاوبة -->
      <div class="controls-row flex items-center justify-center space-x-4 sm:space-x-6 space-x-reverse w-full max-w-xs mb-3 sm:mb-4">
        <!-- الآية السابقة -->
        <button id="prevBtn" class="w-12 h-12 sm:w-14 sm:h-14 rounded-2xl bg-emerald-900/80 border border-emerald-700/50 hover:bg-emerald-800 text-white flex items-center justify-center active:scale-95 transition-all shadow-lg" aria-label="الآية السابقة">
          <svg class="w-6 h-6 sm:w-7 sm:h-7" fill="currentColor" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>

        <!-- زر التشغيل / الإيقاف الرئيسي -->
        <button id="playBtn" class="w-16 h-16 sm:w-18 sm:h-18 p-3.5 sm:p-4 rounded-3xl bg-emerald-700/90 border border-emerald-500/50 hover:bg-emerald-600 text-white flex items-center justify-center active:scale-95 transition-all shadow-xl shadow-emerald-950" aria-label="تشغيل أو إيقاف">
          <svg class="w-8 h-8 sm:w-10 sm:h-10" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </button>

        <!-- الآية التالية -->
        <button id="nextBtn" class="w-12 h-12 sm:w-14 sm:h-14 rounded-2xl bg-emerald-900/80 border border-emerald-700/50 hover:bg-emerald-800 text-white flex items-center justify-center active:scale-95 transition-all shadow-lg" aria-label="الآية التالية">
          <svg class="w-6 h-6 sm:w-7 sm:h-7" fill="currentColor" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>
      </div>

      <!-- دليل إيماءات المكفوفين السريعة -->
      <div class="guide-grid grid grid-cols-3 gap-1.5 sm:gap-2 w-full text-center text-[10px] sm:text-[11px] text-emerald-300/80 py-1">
        <div class="bg-emerald-900/40 p-1.5 sm:p-2 rounded-xl border border-emerald-800/40">
          👆 نقرة مطولة<br><strong class="text-amber-300">للتحدث</strong>
        </div>
        <div class="bg-emerald-900/40 p-1.5 sm:p-2 rounded-xl border border-emerald-800/40">
          ✌️ نقرتان<br><strong class="text-amber-300">تشغيل/إيقاف</strong>
        </div>
        <div class="bg-emerald-900/40 p-1.5 sm:p-2 rounded-xl border border-emerald-800/40">
          👉 سحب أفقي<br><strong class="text-amber-300">تغيير الآية</strong>
        </div>
      </div>
    </div>

  </main>

  <!-- تذييل الصفحة: خيارات المساعدين والقوائم اليدوية -->
  <footer class="relative z-10 w-full bg-emerald-950/95 border-t border-emerald-800/40 px-3 sm:px-4 py-2.5 sm:py-3 safe-bottom backdrop-blur-md">
    <div class="max-w-md mx-auto grid grid-cols-2 gap-2 sm:gap-3">
      <!-- اختيار السورة يدوياً -->
      <div>
        <label for="surahSelect" class="block text-[10px] sm:text-[11px] text-emerald-300 font-semibold mb-1 truncate">اختر السورة:</label>
        <select id="surahSelect" class="w-full bg-emerald-900/80 border border-emerald-700/50 rounded-xl px-2 sm:px-2.5 py-2 text-xs sm:text-sm text-white focus:outline-none focus:border-amber-400">
        </select>
      </div>

      <!-- اختيار القارئ يدوياً -->
      <div>
        <label for="reciterSelect" class="block text-[10px] sm:text-[11px] text-emerald-300 font-semibold mb-1 truncate">اختر القارئ:</label>
        <select id="reciterSelect" class="w-full bg-emerald-900/80 border border-emerald-700/50 rounded-xl px-2 sm:px-2.5 py-2 text-xs sm:text-sm text-white focus:outline-none focus:border-amber-400">
        </select>
      </div>
    </div>
  </footer>

  <!-- نافذة التفسير الميسر المنبثقة -->
  <div id="tafsirModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
    <div class="bg-emerald-900 border border-amber-500/40 rounded-3xl p-6 max-w-md w-full shadow-2xl relative text-center">
      <h3 class="text-xl font-bold text-amber-300 mb-3">التفسير الميسر</h3>
      <p id="tafsirText" class="text-emerald-100 text-sm leading-relaxed mb-6 max-h-60 overflow-y-auto text-right p-3 bg-emerald-950/60 rounded-2xl border border-emerald-800/60"></p>
      <button id="closeTafsirBtn" class="w-full py-3 bg-amber-500 hover:bg-amber-400 text-emerald-950 font-bold rounded-xl shadow-lg transition-all">
        إغلاق التفسير
      </button>
    </div>
  </div>

  <!-- سكربتات التطبيق -->
  <script type="module" src="app.js"></script>

  <!-- تسجيل Service Worker ليعمل التطبيق كـ PWA -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js')
          .then(reg => {
            reg.update();
            console.log('PWA Service Worker registered and checked for update:', reg.scope);
          })
          .catch(err => console.log('Service Worker failed:', err));
      });
    }
  </script>
</body>
</html>
